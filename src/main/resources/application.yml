spring:
  application:
    name: movie-ticketing-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/movie_ticketing}
    username: ${DB_USERNAME:movie_ticketing}
    password: ${DB_PASSWORD:movie_ticketing}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: movie-ticketing-platform
      audience: movie-ticketing-api
      access-token-ttl: PT15M
      clock-skew: PT30S

booking:
  hold-duration: ${BOOKING_HOLD_DURATION}
